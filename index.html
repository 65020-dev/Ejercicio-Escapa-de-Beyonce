<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="app.css">
        <title></title>
    </head>
    <body>

<h1>▲ Escapa de Ganon ▲</h1>
<!-- Cambio 3: Centre el área de juego y añadi informacion de los controles -->
  <div id="layout">
    <aside id="controls">
        <h2>Controles</h2>
        <p><kbd>W</kbd> / <kbd>↑</kbd> Arriba</p>
        <p><kbd>S</kbd> / <kbd>↓</kbd> Abajo</p>
        <p><kbd>A</kbd> / <kbd>←</kbd> Izquierda</p>
        <p><kbd>D</kbd> / <kbd>→</kbd> Derecha</p>
        <p>No dejes que Ganon te robe la trifuerza del valor! D:</p>
    </aside>

    <div id="game-area">
        <div id="player" class="character"></div>
        <div id="enemy" class="character"></div>
    </div>

<aside id="settings">
    <h2>Ajustes</h2>

<label>Velocidad de Link: <span id="player-speed-value">1.75</span>
    <input type="range" id="player-speed" min="0.5" max="6" step="0.25" value="1.75">
</label>

<label>Velocidad de Ganon: <span id="enemy-speed-value">0.75</span>
    <input type="range" id="enemy-speed" min="0.25" max="3" step="0.25" value="0.75">
</label>

    <label>Dale Zelda, dale ♫ <span id="music-volume-value">0.25</span>
        <input type="range" id="music-volume" min="0" max="1" step="0.1" value="0.4">
    </label>

</aside>
</div>
    <audio id="bg-music" src="musica.mp3" loop></audio>
    <script type="text/javascript" src="app.js"></script>
    </body>
        </html>
